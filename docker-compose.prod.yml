version: "3.9"

# ═══════════════════════════════════════════════════════
#  Sports EL — Production Docker Compose Overrides
#  Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ═══════════════════════════════════════════════════════

services:
  db:
    restart: always
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}   # Must be set in production .env

  redis:
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}

  backend:
    restart: always
    volumes: []                            # No dev volume mounts in production
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - LOG_LEVEL=WARNING
    command: >
      uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
        --workers 4
        --proxy-headers
        --forwarded-allow-ips='*'

  frontend:
    restart: always
